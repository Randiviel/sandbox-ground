<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóbr Europejski - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        #login-screen {
            display: none; /* Ukryte na starcie, pokaże to skrypt */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
        }

        #main-content {
            display: none;
        }

        .hero-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 128, 128, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .falling-beaver {
            position: fixed;
            top: -50px;
            font-size: 3rem;
            pointer-events: none;
            z-index: 9999;
            animation: fall 2s linear forwards;
        }
    </style>
</head>
<body>

    <!-- EKRAN ŁADOWANIA -->
    <div id="loading-screen" style="text-align:center; margin-top: 50px;">
        <h2>Ładowanie... 🦫</h2>
    </div>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen">
        <h1>🦫 Bóbr Europejski</h1>
        <p>Zaloguj się, aby uzyskać dostęp do tajnych informacji.</p>
        <button onclick="handleLogin()">Zaloguj się przez Google</button>
    </div>

    <!-- GŁÓWNA TREŚĆ -->
    <div id="main-content">
        <div class="user-bar">
            <span>Witaj, <strong id="user-display-name">...</strong>!</span>
            <button onclick="handleLogout()" class="inline">Wyloguj się</button>
        </div>

        <header>
            <h1>🦫 Bóbr Europejski</h1>
            <p><em>Castor fiber</em> – inżynier z bazy danych.</p>
        </header>

        <img src="Bobr.jpg" alt="Bóbr" class="hero-img">

        <section>
            <h2>Sekretne informacje</h2>
            <div id="dynamic-data" style="border-left: 4px solid #795548; padding-left: 15px; margin: 20px 0;">
                <p><em>Pobieranie danych ze Sztokholmu...</em></p>
            </div>
        </section>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="dropBeaver()" style="background-color: #795548; color: white;">Wciśnij mnie 🦫</button>
        </div>

        <footer>
            <p>Zalogowany jako systemowy obserwator bobrów • 2026</p>
        </footer>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, signOut, onAuthStateChanged, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    // DODANE IMPORTY FIRESTORE:
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA2PSFQmRRFEg1vRNYNcJuDXeMpGKu-574",
        authDomain: "sandbox-ground-1a0af.firebaseapp.com",
        projectId: "sandbox-ground-1a0af",
        storageBucket: "sandbox-ground-1a0af.firebasestorage.app",
        messagingSenderId: "789099240147",
        appId: "1:789099240147:web:abf4e5f63c3db3952c1226",
        measurementId: "G-JSF9TY813P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app); // Inicjalizacja Firestore
    const provider = new GoogleAuthProvider();

    // Logowanie
    window.handleLogin = async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            console.error("Błąd:", error);
            alert("Błąd logowania!");
        }
    };

    // Wylogowanie
    window.handleLogout = () => signOut(auth).then(() => window.location.reload());

    // Animacja bobra
    window.dropBeaver = () => {
        const beaver = document.createElement('div');
        beaver.innerText = '🦫';
        beaver.className = 'falling-beaver';
        beaver.style.left = Math.floor(Math.random() * window.innerWidth) + 'px';
        document.body.appendChild(beaver);
        setTimeout(() => beaver.remove(), 2000);
    };

    // Strażnik stanu (Z DODANYM ASYNC)
    onAuthStateChanged(auth, async (user) => {
        const loadingScreen = document.getElementById('loading-screen');
        const loginScreen = document.getElementById('login-screen');
        const mainContent = document.getElementById('main-content');
        const dynamicData = document.getElementById('dynamic-data');

        loadingScreen.style.display = 'none';

        if (user) {
            console.log("Zalogowano:", user.displayName);
            loginScreen.style.display = 'none';
            mainContent.style.display = 'block';
            document.getElementById('user-display-name').innerText = user.displayName;
        
            try {
                // Pobieranie danych
                const docRef = doc(db, "strona_tresc", "bobry_info");
                const docSnap = await getDoc(docRef);
        
                if (docSnap.exists()) {
                    dynamicData.innerHTML = `
                        <h3>Tajna wiedza z bazy w Sztokholmie:</h3>
                        <p>${docSnap.data().sekret}</p>
                    `;
                } else {
                    dynamicData.innerHTML = "<p>Błąd: Nie znaleziono dokumentu w bazie!</p>";
                }
            } catch (e) {
                console.error("Błąd Firestore:", e);
                dynamicData.innerHTML = "<p>Błąd uprawnień lub bazy danych.</p>";
            }
        } else {
            loginScreen.style.display = 'flex';
            mainContent.style.display = 'none';
        }
    });
</script>
</body>
</html>
