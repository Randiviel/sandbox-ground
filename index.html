
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kurierów</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css"> <!-- Prosty wygląd bez pisania CSS -->
</head>
<body>

    <header>
        <h1>Dashboard Wyników</h1>
        <div id="auth-section">
            <button id="login-btn">Zaloguj przez Google</button>
            <span id="user-info" style="display: none;">
                Witaj, <b id="user-name"></b>!
                <button id="logout-btn">Wyloguj</button>
            </span>
        </div>
    </header>

    <hr>

    <main id="content" style="display: none;">
        <h2>Lista Kurierów</h2>
        <table>
            <thead>
                <tr>
                    <th>Imię i Nazwisko</th>
                    <th>Wynik (%)</th>
                    <th>Akcja</th>
                </tr>
            </thead>
            <tbody id="couriers-list">
                <!-- Tu wpadną dane z JS -->
            </tbody>
        </table>
    </main>

    <!-- Skrypty Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "TWÓJ_KLUCZ",
            authDomain: "TWÓJ_PROJEKT.firebaseapp.com",
            projectId: "TWÓJ_PROJEKT",
            // ... reszta danych z konsoli Firebase
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Elementy strony
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfo = document.getElementById('user-info');
        const content = document.getElementById('content');
        const userName = document.getElementById('user-name');

        // Logowanie
        loginBtn.onclick = () => signInWithPopup(auth, provider);
        logoutBtn.onclick = () => signOut(auth);

        // Śledzenie stanu użytkownika (Zalogowany/Wylogowany)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Sprawdzenie domeny (opcjonalnie, jak rozmawialiśmy wcześniej)
                if (user.email.endsWith("@twoja-firma.pl")) {
                    loginBtn.style.display = 'none';
                    userInfo.style.display = 'block';
                    content.style.display = 'block';
                    userName.innerText = user.displayName;
                    loadCouriers(); // Funkcja ładująca dane
                } else {
                    alert("Tylko dla pracowników!");
                    signOut(auth);
                }
            } else {
                loginBtn.style.display = 'block';
                userInfo.style.display = 'none';
                content.style.display = 'none';
            }
        });

        function loadCouriers() {
            // Tutaj dopiszesz pobieranie danych z Firestore
            const list = document.getElementById('couriers-list');
            list.innerHTML = `<tr><td>Jan Kowalski</td><td>98%</td><td><button>Zapisz</button></td></tr>`;
        }
    </script>
</body>
</html>
